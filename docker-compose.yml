services:
  postgres:
    image: postgres:16-alpine
    container_name: innogram-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innogram-network

  redis:
    image: redis:7-alpine
    container_name: innogram-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innogram-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: innogram-auth
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_USER: ${DB_USER:-postgres}
      DB_HOST: postgres
      DB_DATABASE: ${AUTH_DB_NAME:-innogram_auth}
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${AUTH_DB_NAME:-innogram_auth}?schema=public"
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${AUTH_DB_NAME:-innogram_auth}?schema=public"
      JWT_KEY: ${JWT_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "3001:3001"
    volumes:
      # Mount code for live reload (exclude node_modules to use built ones)
      - ./apps/auth_microservice:/app/apps/auth_microservice
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - /app/node_modules  # Anonymous volume to preserve built node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - innogram-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stdin_open: true
    tty: true

  posts-backend:
    build:
      context: .
      dockerfile: Dockerfile.posts
    container_name: innogram-posts
    environment:
      NODE_ENV: development
      PORT: 3002
      DB_USER: ${DB_USER:-postgres}
      DB_HOST: postgres
      DB_DATABASE: ${POSTS_DB_NAME:-innogram_posts}
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${POSTS_DB_NAME:-innogram_posts}?schema=public"
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${POSTS_DB_NAME:-innogram_posts}?schema=public"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "3002:3002"
    volumes:
      # Mount code for live reload (exclude node_modules to use built ones)
      - ./apps/posts_microservice:/app/apps/posts_microservice
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - /app/node_modules  # Anonymous volume to preserve built node_modules
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - innogram-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:

networks:
  innogram-network:
    driver: bridge
